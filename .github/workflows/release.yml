name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  release:
    needs: test
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build module files
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./module.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match module.json version $version" >&2
            exit 1
          fi

          mkdir -p dist/stage/assets
          node -e '
            const fs = require("fs");
            const manifest = require("./module.json");
            manifest.download = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${process.env.TAG}/module.zip`;
            fs.writeFileSync("dist/module.json", JSON.stringify(manifest, null, 2) + "\n");
          '

          cp dist/module.json dist/stage/module.json
          cp -r scripts lang dist/stage/
          cp -r assets/audio dist/stage/assets/
          cp README.md CHANGELOG.md CREDITS.md LICENSE NOTICE dist/stage/
          (cd dist/stage && zip -qr ../module.zip module.json LICENSE NOTICE README.md CHANGELOG.md CREDITS.md scripts lang assets)

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            dist/module.json
            dist/module.zip
